{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "03:00",
        "timezone": "Asia/Shanghai"
      },
      "open-pull-requests-limit": 2,
      "labels": [
        "dependencies"
      ],
      "groups": {
        "compatible-actions": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      }
    },
    {
      "package-ecosystem": "npm",
      "directory": "/",
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "03:30",
        "timezone": "Asia/Shanghai"
      },
      "open-pull-requests-limit": 2,
      "labels": [
        "dependencies"
      ],
      "groups": {
        "compatible-packages": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "ignore": [
        {
          "dependency-name": "react",
          "update-types": [
            "version-update:semver-major"
          ]
        },
        {
          "dependency-name": "react-dom",
          "update-types": [
            "version-update:semver-major"
          ]
        },
        {
          "dependency-name": "@types/react",
          "update-types": [
            "version-update:semver-major"
          ]
        },
        {
          "dependency-name": "@types/react-dom",
          "update-types": [
            "version-update:semver-major"
          ]
        },
        {
          "dependency-name": "@types/node",
          "update-types": [
            "version-update:semver-major"
          ]
        },
        {
          "update-types": [
            "version-update:semver-major"
          ],
          "dependency-name": "jsdom"
        }
      ]
    }
  ]
}
